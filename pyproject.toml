[project]
name = "ioc-python"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ibek>=3.3.4",
    "stdio-socket>=1.4.0",
    "numpy",
    "scipy",
    "softioc",
    "cothread",
    # PyQt5 and PyQt5-Qt5 publish no linux aarch64 wheels
    "PyQt5; platform_machine == 'x86_64'",
    "matplotlib",
]
